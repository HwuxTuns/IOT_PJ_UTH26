version: '3.8'

services:
  mysql:
    image: mysql:8.0
    env_file: ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-iot_solar_db}
      MYSQL_USER: ${DB_USER:-solar_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-solar_pass123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    depends_on:
      mysql:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USER:-solar_user}
      PMA_PASSWORD: ${DB_PASSWORD:-solar_pass123}
    ports:
      - "8080:80"
    profiles:
      - dev

volumes:
  mysql_data:
